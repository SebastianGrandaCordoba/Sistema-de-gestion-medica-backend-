services:
  - type: web
    name: medical-management-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: DATABASE_HOST
        fromDatabase:
          name: medical-management-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: medical-management-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: medical-management-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: medical-management-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: medical-management-db
          property: password

databases:
  - name: medical-management-db
    databaseName: clinic
    user: clinic_user
    plan: free
